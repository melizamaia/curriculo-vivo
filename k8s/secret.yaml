# Secret de EXEMPLO, só com placeholders. Em produção ele não é versionado:
# vem de um gerenciador de segredos (External Secrets Operator, Sealed Secrets,
# Vault, Secret Manager do provedor), e este arquivo sai do kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: curriculo-vivo-secret
  labels:
    app.kubernetes.io/name: curriculo-vivo
type: Opaque
stringData:
  MONGO_URI: mongodb://USUARIO:SENHA@mongo.exemplo.svc.cluster.local:27017
  # Vazio = justificativa extrativa, sem rede (o padrão da demo). Com uma
  # chave inválida o serviço não cai: cada chamada falha e volta à extrativa.
  ANTHROPIC_API_KEY: SUBSTITUIR-PELA-CHAVE
