# ClusterIP: a API só é alcançada de dentro do cluster (BFF, Ingress).
apiVersion: v1
kind: Service
metadata:
  name: curriculo-vivo-api
  labels:
    app.kubernetes.io/name: curriculo-vivo
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: curriculo-vivo
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
