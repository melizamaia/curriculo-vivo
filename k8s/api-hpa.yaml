# Escala a API por CPU. A análise é CPU-bound (TF-IDF e cosseno em memória,
# sem I/O no caminho do request), então CPU é o sinal certo. Depende do
# metrics-server no cluster e dos requests de CPU do Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: curriculo-vivo-api
  labels:
    app.kubernetes.io/name: curriculo-vivo
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: curriculo-vivo-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
