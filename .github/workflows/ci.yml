name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-e-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push do painel no branch gh-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala as dependências
        run: pip install -r requirements.txt

      # Sem Mongo, Kafka nem chave de LLM: o serviço cai nos fallbacks.
      - name: Testes
        run: pytest -q

      # Sai com código diferente de zero quando uma meta dura é violada.
      - name: Avaliação
        run: python -m eval.run_eval

      # always(): o painel é gerado antes da checagem das metas, então
      # ele também fica disponível quando o eval reprova o build.
      - name: Publica o painel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard
          path: dashboard/index.html
          if-no-files-found: warn

      # Painel no GitHub Pages (branch gh-pages), só em push na main e com
      # o eval aprovado: o link público mostra sempre o último build verde.
      - name: Publica o painel no GitHub Pages
        if: github.event_name == 'push'
        working-directory: dashboard
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add index.html .nojekyll
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "painel de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
